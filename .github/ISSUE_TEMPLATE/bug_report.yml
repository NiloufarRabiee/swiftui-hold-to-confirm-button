name: Bug report
description: Report unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve HoldToConfirmButton.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the component...
        2. Hold the button...
        3. Observe...
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: iOS 18, macOS 15, etc.
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: Xcode 16.x

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that helps.
